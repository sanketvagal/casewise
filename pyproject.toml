[project]
name = "casewise"
version = "0.1.0"
description = "Safety-first LLM triage for clinical SaaS support, with evals that prove it."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
casewise = "casewise.cli:main"

[project.optional-dependencies]
live = [
    "groq>=1.7.0",
    "sentence-transformers>=6.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casewise"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
